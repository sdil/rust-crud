[package]
name = "rust-crud-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.41", features = ["serde"] }
serde = "1.0.228"
serde_json = "1.0.150"
sea-orm = { version = "~2.0.0-rc.40", features = [ "sqlx-sqlite", "runtime-tokio-native-tls", "macros", "with-time", "with-uuid", "sqlite-use-returning-for-3_35" ] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }

